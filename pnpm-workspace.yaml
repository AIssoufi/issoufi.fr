# Only installs versions published at least 7 days ago (in minutes), the same delay as the
# Dependabot cooldown, which applies this setting when it updates the lockfile
minimumReleaseAge: 10080
# pnpm itself is pinned on purpose by the packageManager field of package.json: without this
# exclusion, a pnpm that switches to the pinned version refuses one younger than 7 days, for the day
# when pmOnFail lets it switch again (ISF-353)
minimumReleaseAgeExclude:
  - pnpm
  - '@pnpm/*'

overrides:
  # Keeps every copy of postcss, which only Vite uses since styled-components 6.5, at a version
  # without the GHSA path-traversal/file-read alerts that no Dependabot PR covered, and within
  # the range of Vite
  postcss: ^8.5.29

# Keeps pnpm-lock.yaml one YAML document: when pnpm switches to the version of packageManager, it
# writes that version in a first document, and the dependency graph of GitHub then sees no
# dependency, so Dependabot raises no security alert (dependabot/dependabot-core#15904, ISF-353)
pmOnFail: ignore
