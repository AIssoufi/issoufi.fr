name: Release

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Keeps a release pull request open against develop with the next version and its
      # CHANGELOG.md entry. Merging it tags the version and publishes a GitHub release.
      - uses: googleapis/release-please-action@v5
        with:
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
