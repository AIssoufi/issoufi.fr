name: Release

on:
  push:
    branches: [develop]
  # Started by the daily release of deploy-production.yml once it merged the release pull request:
  # its merge, made with the GITHUB_TOKEN, starts no push run
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # Keeps a release pull request open against develop with the next version and its
      # CHANGELOG.md entry. Merging it tags the version and publishes a GitHub release.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  standalone-build:
    # Attaches to each new release a build of the site that opens from the disk, next to the
    # source archives that GitHub adds itself
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: ./.github/actions/setup
      - run: pnpm build:standalone
      # The archive holds one folder named after it, so unzipping it never scatters its files
      - run: |
          mv dist-standalone "$ARCHIVE"
          zip -r -X -q "$ARCHIVE.zip" "$ARCHIVE"
          gh release upload "$TAG_NAME" "$ARCHIVE.zip" --clobber
        env:
          ARCHIVE: issoufi.fr-v${{ needs.release-please.outputs.version }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
