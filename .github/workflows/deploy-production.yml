name: Deploy to production

on:
  schedule:
    # Every 30 minutes from 4:07 to 6:37 UTC: 6:07 to 8:37 in Paris in summer (UTC+2), 5:07 to
    # 7:37 in winter (UTC+1). GitHub may drop a scheduled run under load, mostly at the start of
    # an hour, so the next one catches it. The schedule step stops the runs before 6:00 in Paris
    # (DEPLOY_START_MINUTES, scripts/ci/constants.mjs) and those after a run of the day that passed.
    - cron: '7,37 4-6 * * *'
  # Deploys at once, from the Actions tab or with gh workflow run deploy-production.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show what would be released and deployed, without merging the release pull request or pushing to main
        type: boolean
        default: false

# The GITHUB_TOKEN only reads, except in the release job, and the push to main uses the deploy key
permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.schedule.outputs.due }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Reads the scheduled runs of this workflow (actions: read), and warns when GitHub skipped
      # every one of a day
      - id: schedule
        name: Check the schedule
        run: node scripts/ci/check-deploy-schedule.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release:
    # Merges the release pull request once the CI of its pull request event passed, so that
    # production gets the new version, then publishes the release and runs the CI on develop: the
    # merge, made with the GITHUB_TOKEN, starts no push run. It never fails, and leaves a notice
    # when no release is made, or a warning when someone has to act.
    needs: schedule
    if: needs.schedule.outputs.due == 'true'
    runs-on: ubuntu-latest
    # Two attempts on the release pull request (RELEASE_MERGE_ATTEMPTS), each looking for its run
    # for up to a minute, waiting for it up to 20 minutes (RUN_WAIT_ATTEMPTS) and up to 5 minutes
    # for the pull request to become mergeable (MERGEABLE_WAIT_ATTEMPTS), then the CI of develop
    timeout-minutes: 75
    permissions:
      # Merges the release pull request
      contents: write
      pull-requests: write
      # Approves the held CI of the release pull request, starts ci.yml and release.yml, and
      # follows their runs
      actions: write
      # Names the required checks that did not pass when the release pull request cannot merge
      checks: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Release the version of the day
        run: node scripts/ci/merge-release-pr.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ github.token }}

  check:
    # Runs even when the release failed, which must not stop the deploy
    needs: [schedule, release]
    if: ${{ !cancelled() && needs.schedule.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    # Waits up to 20 minutes for a run of the CI of develop still going (RUN_WAIT_ATTEMPTS), after
    # the checkout of the whole history
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The trees of main and develop are compared below
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # A job condition cannot read secrets, and the key itself stays out of this job
      - name: Check the deploy key
        env:
          HAS_DEPLOY_KEY: ${{ secrets.DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_DEPLOY_KEY" != "true" ]; then
            echo "::error::The DEPLOY_KEY secret is not set: add a deploy key with write access to the repository, and its private key as the DEPLOY_KEY secret (see docs/deployment.md, Setup by the site owner)."
            exit 1
          fi

      # actions/checkout sets origin/develop back to the commit that started the run, which lacks
      # the release that the release job merged since: the fetch reads both branches as they are
      # now. main holds merge commits that develop lacks, but no content of its own: the same tree
      # means that main already serves develop. deploy-production.spec.js runs this step
      - id: trees
        name: Compare develop with main
        run: |
          git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse 'origin/develop^{tree}')" = "$(git rev-parse 'origin/main^{tree}')" ]; then
            echo "::notice::Nothing to deploy: main already holds the content of develop."
          else
            echo "sha=$(git rev-parse origin/develop)" >> "$GITHUB_OUTPUT"
          fi

      - id: ci
        name: Check the CI of develop
        if: steps.trees.outputs.sha != ''
        run: node scripts/ci/check-develop-ci.mjs
        env:
          DEPLOY_SHA: ${{ steps.trees.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}

  promote:
    needs: check
    # A failed release, two jobs up, would otherwise skip this job too
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A push with the deploy key, unlike one with the GITHUB_TOKEN, starts the CI on main, and
      # the ruleset of main lets the deploy keys push without a pull request
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Merges the commit whose CI passed, even when develop moved since the check
      - id: merge
        name: Merge develop into main
        env:
          DEPLOY_SHA: ${{ needs.check.outputs.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if ! git merge --no-ff --no-edit -m 'chore: deploy develop to production' "$DEPLOY_SHA"; then
            echo "::error::develop does not merge into main without conflicts: merge main into develop first."
            exit 1
          fi
          # Production must serve exactly the tested commit, not a mix with changes of main
          if [ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse "$DEPLOY_SHA^{tree}")" ]; then
            echo "::error::main holds changes that develop lacks, so the merge differs from the tested commit: merge main into develop first."
            exit 1
          fi
          echo "merge_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The push starts the CI on main: tests, build, browser test, production deploy, smoke test
      - name: Push to main
        if: ${{ !inputs.dry_run }}
        run: git push origin HEAD:main

      # Connects with the deploy key as the push would, but sends nothing: only a real push meets
      # the ruleset of main
      - name: Push to main (dry run)
        if: ${{ inputs.dry_run }}
        run: git push --dry-run origin HEAD:main

      - name: Report
        run: node scripts/ci/write-deploy-report.mjs
        env:
          MAIN_SHA: ${{ steps.merge.outputs.main_sha }}
          DEPLOY_SHA: ${{ needs.check.outputs.sha }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ github.token }}
