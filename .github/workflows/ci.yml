name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Rebuilds and redeploys a branch, from the Actions tab or from rebuild.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer commit replaces a running pull request check, but runs on main and develop always finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      # Lists the files, exports and dependencies that nothing uses, even when ESLint failed
      - if: ${{ !cancelled() }}
        run: pnpm knip

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage
      # The summary and the report also help to understand failed tests or thresholds
      - if: ${{ !cancelled() }}
        run: node scripts/ci/write-coverage-summary.mjs
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Dependabot does not update them: take both from actionlint_<version>_checksums.txt in a
      # release of rhysd/actionlint, the checksum on the linux_amd64 line
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      # actionlint checks the run scripts with shellcheck, preinstalled on the runner, and silently
      # skips them when it is missing
      - run: shellcheck --version
      # The matcher turns each error into an annotation on the line of the workflow
      - run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          "$RUNNER_TEMP/actionlint" -color
      - if: ${{ !cancelled() }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # actionlint accepts an action of a third party referenced by a tag, which its owner can move
      - if: ${{ !cancelled() }}
        run: node scripts/ci/check-action-pins.mjs
      # actions/checkout keeps the token of the job in the git config for every later step unless
      # it sets persist-credentials: false. This check asks for false, or for true with a comment
      # that names the later step using the token
      - if: ${{ !cancelled() }}
        run: node scripts/ci/check-checkout-credentials.mjs

  # Lints the commits of a pull request. Its title has a workflow of its own,
  # pull-request-title.yml, which also runs on each edit of the pull request
  commits:
    # Dependabot writes conventional subjects, but its bodies hold release notes with long lines
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  dependencies:
    # Fails when a pull request adds or upgrades to a dependency with a known vulnerability
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@v5

  # Warns when neither the Cloudflare trigger nor the crons of GitHub start deploy-production.yml
  # any more, which the deploy cannot report while it does not run, or when the trigger alone
  # stopped while the crons go on. It never fails the run: the deploy requires the CI of develop
  # to pass
  deploy-schedule:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      # Reads the scheduled runs of deploy-production.yml
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/ci/check-deploy-schedule-gap.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    needs: [format, lint, typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm size
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Splits the Playwright tests in Chromium over parallel jobs, each running a slice of them on its
  # own runner, so the wall time stays well under the timeout as the suite grows
  browser-test-shard:
    needs: build
    name: browser-test (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Every shard runs to its end, so one run lists all the failed tests
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Tests the build that the deploy job uploads, served by pnpm preview
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: ./.github/actions/playwright
      # Playwright splits the tests in file order into slices of the same number of tests
      - run: pnpm test:browser --project=chromium --shard="$SHARD"
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      # Fails once Chromium prints the same CV twice with other bytes than its dates, which would
      # make every run of pnpm cv change the PDFs in git. It needs the browser but not the build, so
      # one shard runs it
      - if: matrix.shard == 1
        run: pnpm cv:check
      # Holds a screenshot of each page that failed
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  # Runs the phone specs in WebKit, the engine of Safari, on its own runner, so the Chromium shards
  # keep their duration. It runs in the image of Playwright, which holds WebKit and its system
  # libraries, so it reads no apt mirror (decision 0024)
  browser-test-webkit:
    needs: build
    name: browser-test (webkit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # The tag names the version of @playwright/test in the lockfile, and the digest pins its
      # content. Dependabot updates neither: change both with that version (docs/testing.md), or
      # the first launch of WebKit fails and names the image it needs
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      # Not root but the user of the runner, who writes the workspace, as the docs of Playwright do
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # No .github/actions/playwright: the image holds the browsers in /ms-playwright, and the cache
      # of that action, saved on the runner, would restore them to /.cache, which that user cannot
      # create
      - run: pnpm test:browser --project=webkit
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results-webkit
          path: test-results/
          retention-days: 14

  # The required check of both rulesets, which name it: it passes once every shard and the WebKit
  # job passed, and fails when one failed or was skipped, since a skipped required check would let
  # a pull request merge
  browser-test:
    needs: [browser-test-shard, browser-test-webkit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: needs.browser-test-shard.result != 'success'
        run: |
          echo "::error::The browser tests did not pass: their shards ended with '${SHARDS_RESULT}'."
          exit 1
        env:
          SHARDS_RESULT: ${{ needs.browser-test-shard.result }}
      - if: needs.browser-test-webkit.result != 'success'
        run: |
          echo "::error::The browser tests did not pass in WebKit: its job ended with '${WEBKIT_RESULT}'."
          exit 1
        env:
          WEBKIT_RESULT: ${{ needs.browser-test-webkit.result }}

  # Compares the screenshots of every page with those of the base of the pull request, at four
  # widths in each language, and lists the changed screens in the job summary (pnpm test:visual).
  # It only informs: no ruleset requires it, and a changed screen does not fail it, since the pull
  # request may mean it. A screen that could not be compared does
  visual:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The merge commit of the pull request, whose first parent is the base branch it merges into
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: pnpm test:visual --base HEAD^1
      # The HTML report shows each changed screen before and after the change, with their diff
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: visual-report/
          retention-days: 14
          if-no-files-found: ignore

  credentials:
    # Pull requests from forks and from Dependabot get no repository secrets
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cloudflare: ${{ steps.check.outputs.cloudflare }}
    steps:
      # A job condition cannot read secrets, so this step tells the deploy job whether they exist
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deployment skipped: the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are not set."
          fi

  deploy:
    needs: [build, browser-test, credentials]
    if: needs.credentials.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      # Installs the wrangler of the lockfile
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # main is the production branch of the Cloudflare Pages project, any other branch a preview.
      # Without a wranglerVersion, the action runs the wrangler that the setup installed, and
      # installs none of its own
      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: >-
            pages deploy dist --project-name=issoufi-fr --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: node scripts/ci/smoke-test.mjs "$DEPLOYMENT_URL"
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.url }}
      # Without a URL, the smoke test and the redirect check read the production address from
      # SITE_URL in scripts/ci/constants.mjs
      - name: Smoke-test the production site
        if: github.ref == 'refs/heads/main'
        run: node scripts/ci/smoke-test.mjs
      - name: Check the redirects to the production site
        if: github.ref == 'refs/heads/main'
        run: node scripts/ci/check-redirects.mjs
