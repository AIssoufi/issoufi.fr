name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Rebuilds and redeploys a branch, from the Actions tab or from rebuild.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer commit replaces a running pull request check, but runs on main and develop always finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage
      # The summary and the report also help to understand failed tests or thresholds
      - if: ${{ !cancelled() }}
        run: node scripts/ci/write-coverage-summary.mjs
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Dependabot does not update them: take both from actionlint_<version>_checksums.txt in a
      # release of rhysd/actionlint, the checksum on the linux_amd64 line
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      # actionlint checks the run scripts with shellcheck, preinstalled on the runner, and silently
      # skips them when it is missing
      - run: shellcheck --version
      # The matcher turns each error into an annotation on the line of the workflow
      - run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          "$RUNNER_TEMP/actionlint" -color

  commits:
    # Dependabot writes conventional subjects, but its bodies hold release notes with long lines
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  dependencies:
    # Fails when a pull request adds or upgrades to a dependency with a known vulnerability
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@v5

  build:
    needs: [format, lint, typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm size
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Splits the Playwright tests over parallel jobs, each running a slice of them on its own runner,
  # so the wall time stays well under the timeout as the suite grows
  browser-test-shard:
    needs: build
    name: browser-test (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Every shard runs to its end, so one run lists all the failed tests
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Tests the build that the deploy job uploads, served by pnpm preview
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Only the browser of the Playwright version in the lockfile is cached: the system libraries
      # it needs are installed on every run, and an installed browser is not downloaded again
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      # Playwright splits the tests in file order into slices of the same number of tests
      - run: pnpm test:browser --shard="$SHARD"
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      # Fails once Chromium prints the same CV twice with other bytes than its dates, which would
      # make every run of pnpm cv change the PDFs in git. It needs the browser but not the build, so
      # one shard runs it
      - if: matrix.shard == 1
        run: pnpm cv:check
      # Holds a screenshot of each page that failed
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  # The required check of both rulesets, which name it: it passes once every shard passed, and fails
  # when one failed or was skipped, since a skipped required check would let a pull request merge
  browser-test:
    needs: browser-test-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: needs.browser-test-shard.result != 'success'
        run: |
          echo "::error::The browser tests did not pass: their shards ended with '${SHARDS_RESULT}'."
          exit 1
        env:
          SHARDS_RESULT: ${{ needs.browser-test-shard.result }}

  credentials:
    # Pull requests from forks and from Dependabot get no repository secrets
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cloudflare: ${{ steps.check.outputs.cloudflare }}
    steps:
      # A job condition cannot read secrets, so this step tells the deploy job whether they exist
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deployment skipped: the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are not set."
          fi

  deploy:
    needs: [build, browser-test, credentials]
    if: needs.credentials.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # main is the production branch of the Cloudflare Pages project, any other branch a preview
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: >-
            pages deploy dist --project-name=issoufi-fr --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: node scripts/ci/smoke-test.mjs "$DEPLOYMENT_URL"
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.url }}
      # Without a URL, the smoke test and the redirect check read the production address from
      # SITE_URL in scripts/ci/constants.mjs
      - name: Smoke-test the production site
        if: github.ref == 'refs/heads/main'
        run: node scripts/ci/smoke-test.mjs
      - name: Check the redirects to the production site
        if: github.ref == 'refs/heads/main'
        run: node scripts/ci/check-redirects.mjs
