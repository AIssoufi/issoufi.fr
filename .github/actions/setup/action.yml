name: Setup
description: >-
  Installs pnpm (version from the packageManager field of package.json), Node.js (version from
  .nvmrc) and the project dependencies, with the pnpm store cached between runs. Run it after
  actions/checkout.

runs:
  using: composite
  steps:
    # 6.1.0 is the first version that installs pnpm 12, and the v6 tag still points to 6.0.10
    - uses: pnpm/action-setup@v6.1.0

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
