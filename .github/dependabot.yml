version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Gives a new release a week to be fixed or pulled before it is proposed
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types of Node.js follow the major version of the runtime, read from .nvmrc: types of a
      # newer Node.js would let the code use APIs that the runtime lacks. Move both together.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    # The workflows and the composite actions they share
    directories: [/, /.github/actions/*]
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']
