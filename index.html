<!doctype html>
<html lang="%PAGE_LANGUAGE%">

    <meta charset="utf-8" />
    <link
      rel="icon"
      href="/favicon.ico"
    />

      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta
      name="theme-color"
      content="#000000"
    />
    <meta
      name="description"

      rel="canonical"

      content="website"
    />
